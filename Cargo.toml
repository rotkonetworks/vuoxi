[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/chunk",
    "crates/layers",
    "crates/watcher",
    "crates/store",
    "crates/archive",
    "crates/transport-iroh",
    "crates/transport-commonware",
    "crates/sim",
    "crates/rpc",
    "crates/cli",
    "crates/caps",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rotkonetworks/vuoxi"

[workspace.dependencies]
tower-service = "0.3"
tower-layer = "0.3"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", default-features = false }
vuoxi-core = { path = "crates/core" }
vuoxi-layers = { path = "crates/layers" }
vuoxi-chunk = { path = "crates/chunk" }
fastcdc = "5"
nomt = "1.0.5"
blake3 = "1"
vuoxi-rpc = { path = "crates/rpc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
biscuit-auth = "6"
ed25519-dalek = "2"

[profile.release]
lto = true
codegen-units = 1
