[package]
name = "vuoxi"
description = "The vuoxi CLI: a thin client of the daemon's JSON-RPC surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vuoxi"
path = "src/main.rs"

[dependencies]
vuoxi-rpc.workspace = true
vuoxi-config.workspace = true
vuoxi-daemon.workspace = true
vuoxi-transport-iroh.workspace = true
vuoxi-core.workspace = true
vuoxi-rules.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }
serde.workspace = true
serde_json.workspace = true
